name: Build & Release Expiry Control Center

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Multiplatform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-gnu

      - name: Install Cross-Compilers
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 musl-tools

      - name: Build Static Linux Binary (musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Build Windows Executable
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package Artifacts
        run: |
          mkdir -p artifacts
          cp target/x86_64-unknown-linux-musl/release/expiry-ctl artifacts/expiry-ctl
          cp target/x86_64-unknown-linux-musl/release/expiry-ctl artifacts/expiry-ctl-linux
          cp target/x86_64-pc-windows-gnu/release/expiry-ctl.exe artifacts/expiry-ctl.exe

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/expiry-ctl
            artifacts/expiry-ctl-linux
            artifacts/expiry-ctl.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
